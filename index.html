<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151f">
  <title>UZEX Time</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">UZEX TIME · MILLISEKUND</p>
    <div class="dial-wrap" aria-label="Har bir soniyada to‘liq aylanadigan millisekund soati">
      <svg class="dial" viewBox="0 0 300 300" role="img" aria-label="To‘q sariq belgi 800 millisekundni ko‘rsatadi">
        <circle class="dial-ring" cx="150" cy="150" r="121"></circle>
        <line class="target-mark" x1="31" y1="111" x2="46" y2="116"></line>
        <line class="target-mark" x1="60" y1="66" x2="72" y2="75"></line>
        <text class="dial-mark" x="82" y="73">870</text>
        <text class="dial-mark" x="150" y="20">000</text><text class="dial-mark" x="279" y="154">250</text><text class="dial-mark" x="150" y="290">500</text><text class="dial-mark" x="21" y="154">750</text>
        <line id="hand" class="dial-hand" x1="150" y1="150" x2="150" y2="48"></line>
        <circle class="dial-dot" cx="150" cy="150" r="7"></circle>
        <text id="milliseconds" class="dial-ms" x="150" y="143">000</text><text class="dial-unit" x="150" y="165">ms</text>
      </svg>
    </div>
    <output id="clock" aria-live="off">00:00:00.000</output>
    <p class="target-label">To‘q sariq belgi · 800 ms signal nuqtasi</p>
    <p id="status" class="status">UZEX vaqti bilan sinxronlanmoqda…</p>
    <div class="controls">
      <button id="stopButton" class="primary" type="button">To‘xtatish</button>
      <button id="syncButton" type="button">Sinxronlash</button>
    </div>
    <p class="hint">“To‘xtatish” ekrandagi vaqtni muzlatadi. Mashq uchun 800 ms da bosib ko‘ring.</p>
    <p class="safe-note">Bu ilova faqat vaqt indikatori. Savdo yoki zayavka yubormaydi.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
